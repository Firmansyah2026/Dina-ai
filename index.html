<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1b1424"><title>Dina — Teman Bicara AI</title>
<style>
:root{--pink:#f35da9;--white:#fff8ff;--muted:#c9bbd2;--line:#ffffff20}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:14px;background:radial-gradient(ellipse at top,#51314f,#1b1424 55%,#100d16);color:var(--white);font-family:system-ui,sans-serif;display:flex;justify-content:center}.phone{width:min(100%,420px);min-height:calc(100vh - 28px);border:1px solid var(--line);border-radius:30px;background:#17111fee;overflow:hidden;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:11px;padding:17px 18px;border-bottom:1px solid var(--line)}.brandicon{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#f36db4,#8c65c9);font-size:24px}.brand{font-size:18px;font-weight:750}.sub{font-size:12px;color:#a9f1c0;margin-top:2px}main{padding:18px;display:flex;flex-direction:column;gap:14px;flex:1}.hero{min-height:300px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:20px;background:linear-gradient(155deg,#69445f,#32243d 58%,#211827);border:1px solid var(--line)}.avatar{font-size:110px;line-height:1.4}.hero h1{font-size:22px;margin:0 0 5px}.hero p{font-size:13px;color:#f0dfef;margin:0}.chatbox{border:1px solid var(--line);background:#ffffff08;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:9px;max-height:300px;min-height:130px;overflow:auto}.bubble{padding:10px 12px;border-radius:15px;font-size:14px;line-height:1.4;max-width:92%;white-space:pre-wrap}.dina{background:#ffffff12;align-self:flex-start}.you{background:linear-gradient(135deg,#9b4db0,#d74f9e);align-self:flex-end}.inputrow{display:flex;gap:8px}.inputrow input{min-width:0;flex:1;border-radius:24px;border:1px solid var(--line);background:#ffffff0d;color:white;padding:13px 15px;outline:none}.send{border:0;border-radius:50%;width:48px;background:var(--pink);color:white;font-size:20px}.send:disabled{opacity:.5}.hint{text-align:center;color:var(--muted);font-size:12px;min-height:18px}.privacy{font-size:10px;color:#96879f;text-align:center;padding:0 16px 15px}
</style></head><body><section class="phone"><header><div class="brandicon">🌷</div><div><div class="brand">Dina <span style="color:#f36db4">♥</span></div><div class="sub">● Teman Bicara AI · online</div></div></header><main><div class="hero"><div class="avatar">🌸</div><h1>Assalamu’alaikum, Mas</h1><p>Dina siap menemani percakapan Mas.</p></div><div class="chatbox" id="chat" aria-live="polite"><div class="bubble dina">Wa’alaikumussalam, Mas. Ada yang ingin Mas ceritakan hari ini? 💗</div></div><div class="inputrow"><input id="text" placeholder="Tulis pesan untuk Dina…" autocomplete="off"><button class="send" id="send">➤</button></div><div class="hint" id="hint">Kirim pesan untuk memulai percakapan dengan AI.</div></main><div class="privacy">Jangan kirim kata sandi, API key, atau informasi sangat pribadi.</div></section>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('text'),send=document.getElementById('send'),hint=document.getElementById('hint');let history=[];
function bubble(text,who){const el=document.createElement('div');el.className='bubble '+who;el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight}
async function sendMessage(){const t=input.value.trim();if(!t)return;input.value='';bubble(t,'you');history.push({role:'user',content:t});send.disabled=true;hint.textContent='Dina sedang menyiapkan jawaban…';try{const r=await fetch('/.netlify/functions/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history.slice(-10)})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Permintaan gagal');const answer=d.reply||'Maaf, Dina belum menerima jawaban.';history.push({role:'assistant',content:answer});bubble(answer,'dina');hint.textContent='Dina menerima pesan melalui AI online.'}catch(e){history.pop();bubble('Maaf, Mas. '+e.message,'dina');hint.textContent='Periksa pengaturan fungsi AI di Netlify.'}finally{send.disabled=false;input.focus()}}
send.addEventListener('click',sendMessage);input.addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});
</script></body></html>
